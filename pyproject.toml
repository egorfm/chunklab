[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chunklab"
version = "0.1.0"
description = "PDF Chunking & Retrieval Benchmark System"
authors = [{ name = "ChunkLab Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.28",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.24.0",
    "langchain-text-splitters>=0.2.0",
    "sentence-transformers>=3.0.0",
    "qdrant-client>=1.9.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pandas>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]
